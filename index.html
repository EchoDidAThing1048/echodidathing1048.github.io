<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Name</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#000;
color:#fff;
overflow-x:hidden;
}

/* NAV */

header{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
padding:25px 50px;
z-index:10;
}

.logo{
font-weight:900;
font-size:24px;
letter-spacing:-1px;
}

nav a{
color:white;
text-decoration:none;
margin-left:25px;
font-size:14px;
text-transform:uppercase;
opacity:.8;
transition:.3s;
}

nav a:hover{
opacity:1;
}

/* HERO */

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:url("https://images.unsplash.com/photo-1505740420928-5e560c06d30e") center/cover no-repeat;
}

.hero h1{
font-size:120px;
font-weight:900;
letter-spacing:-4px;
animation:fadeUp 1s ease;
}

.hero p{
margin-top:10px;
font-size:18px;
opacity:.8;
animation:fadeUp 1.5s ease;
}

/* SECTIONS */

section{
padding:120px 10%;
}

.section-title{
font-size:60px;
margin-bottom:50px;
font-weight:800;
}

/* MUSIC */

.music-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.album{
background:#111;
padding:20px;
transition:.3s;
}

.album img{
width:100%;
}

.album:hover{
transform:translateY(-10px);
}

/* TOUR */

.tour-date{
display:flex;
justify-content:space-between;
border-bottom:1px solid #333;
padding:20px 0;
font-size:18px;
}

button{
background:white;
color:black;
border:none;
padding:10px 18px;
cursor:pointer;
font-weight:700;
}

/* FOOTER */

footer{
text-align:center;
padding:80px 20px;
font-size:14px;
opacity:.6;
}

/* ANIMATION */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<header>
<div class="logo">ARTIST</div>
<nav>
<a href="#music">Music</a>
<a href="#tour">Tour</a>
<a href="#merch">Merch</a>
</nav>
</header>

<!-- HERO -->

<section class="hero">
<h1>ARTIST NAME</h1>
<p>New album out now</p>
</section>

<!-- MUSIC -->

<section id="music">
<h2 class="section-title">Music</h2>

<div class="music-grid">

<div class="album">
<img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4">
<p>Album One</p>
</div>

<div class="album">
<img src="https://images.unsplash.com/photo-1507874457470-272b3c8d8ee2">
<p>Album Two</p>
</div>

<div class="album">
<img src="https://images.unsplash.com/photo-1497032205916-ac775f0649ae">
<p>Album Three</p>
</div>

</div>
</section>

<!-- TOUR -->

<section id="tour">
<h2 class="section-title">Tour</h2>

<div class="tour-date">
<span>Atlanta — The Masquerade</span>
<button>Tickets</button>
</div>

<div class="tour-date">
<span>New York — Irving Plaza</span>
<button>Tickets</button>
</div>

<div class="tour-date">
<span>Los Angeles — The Fonda</span>
<button>Tickets</button>
</div>

</section>

<!-- FOOTER -->

<footer>
© 2026 Artist Name
</footer>

</body>
</html>
